        function MatchGame({ pairs, onComplete }) {
            const [cards, setCards] = useState([]);
            const [selectedEn, setSelectedEn] = useState(null);
            const [selectedEs, setSelectedEs] = useState(null);
            const [matchedIds, setMatchedIds] = useState([]);
            const [errorAnim, setErrorAnim] = useState(false);

            useEffect(() => {
                let initialCards = [];
                pairs.forEach((p, idx) => {
                    initialCards.push({ id: `en-${idx}`, pairId: idx, text: p.en, lang: 'en' });
                    initialCards.push({ id: `es-${idx}`, pairId: idx, text: p.es, lang: 'es' });
                });
                setCards(initialCards.sort(() => Math.random() - 0.5));
            }, [pairs]);

            const handleClick = (card) => {
                if (matchedIds.includes(card.pairId)) return;
                if (card.lang === 'en') { setSelectedEn(selectedEn === card.id ? null : card.id); } 
                else { setSelectedEs(selectedEs === card.id ? null : card.id); }
            };

            useEffect(() => {
                if (selectedEn && selectedEs) {
                    const enCard = cards.find(c => c.id === selectedEn);
                    const esCard = cards.find(c => c.id === selectedEs);
                    
                    if (enCard.pairId === esCard.pairId) {
                        setMatchedIds([...matchedIds, enCard.pairId]);
                        setSelectedEn(null); setSelectedEs(null);
                        speakEnglish(enCard.text); 
                        if (matchedIds.length + 1 === pairs.length) setTimeout(() => onComplete(), 800);
                    } else {
                        setErrorAnim(true);
                        setTimeout(() => { setSelectedEn(null); setSelectedEs(null); setErrorAnim(false); }, 600);
                    }
                }
            }, [selectedEn, selectedEs]);

            return (
                <div className="bg-slate-800 p-6 rounded-2xl my-6 shadow-md">
                    <h3 className="text-white font-bold text-xl mb-4 text-center">🎮 Reto Mental: Une las Parejas</h3>
                    <div className="grid grid-cols-2 gap-3">
                        {cards.map(card => {
                            const isSelected = selectedEn === card.id || selectedEs === card.id;
                            const isMatched = matchedIds.includes(card.pairId);
                            const isError = errorAnim && isSelected;
                            let baseClasses = "py-3 px-2 rounded-xl font-bold text-center transition-all cursor-pointer shadow-sm text-sm sm:text-base ";
                            if (isMatched) baseClasses += "bg-green-500 text-white opacity-50 cursor-default";
                            else if (isError) baseClasses += "bg-red-500 text-white animate-pulse";
                            else if (isSelected) baseClasses += "bg-blue-400 text-white ring-4 ring-blue-200";
                            else baseClasses += card.lang === 'en' ? "bg-slate-100 text-slate-800 hover:bg-slate-200" : "bg-indigo-100 text-indigo-900 hover:bg-indigo-200";
                            return <div key={card.id} onClick={() => handleClick(card)} className={baseClasses}>{card.text}</div>
                        })}
                    </div>
                </div>
            );
        }

        function UnitOneNotebook({ sectionsData, onExit }) {
          const [sections, setSections] = useState(sectionsData);

          const [view, setView] = useState('list'); 
          const [currentSection, setCurrentSection] = useState(null);

          const [results, setResults] = useState(null); 
          const [hintsVisible, setHintsVisible] = useState({}); 
          const [matchCompleted, setMatchCompleted] = useState(false);

          const evaluateSmart = (userText, exercise) => {
              const rawUser = (userText || "").toLowerCase().replace(/[.,/#!$%^&*;:{}=\-_`~()]/g, "");
              const cleanUser = rawUser.replace(/\s+/g, ' ').trim(); 
              const cleanCorrect = exercise.correct_answer.toLowerCase().replace(/[.,/#!$%^&*;:{}=\-_`~()]/g, "").replace(/\s+/g, " ").trim();
              
              if (cleanUser === cleanCorrect) return { status: 'correct', msg: '¡Perfecto!' };

              let specificFeedback = "";
              if (cleanCorrect.includes("going to") && cleanUser.includes("going to")) {
                  if (!cleanUser.includes("am") && !cleanUser.includes("is") && !cleanUser.includes("are")) specificFeedback = "⚠️ Olvidaste el verbo To Be (am/is/are) antes del 'going to'.";
              }
              if ((cleanCorrect.includes("want to") || cleanCorrect.includes("need to") || cleanCorrect.includes("have to")) && !cleanUser.includes("to")) {
                   specificFeedback = "⚠️ Te comiste el puente 'to' que separa los dos verbos.";
              }
              if (cleanUser.length > 0 && Math.abs(cleanUser.length - cleanCorrect.length) <= 2) {
                   specificFeedback = "⚠️ Fíjate bien en la ortografía (dedazo).";
              }

              const userWords = cleanUser.split(" "); const correctWords = cleanCorrect.split(" ");
              const ignorables = ['a', 'an', 'the'];
              const coreCorrect = correctWords.filter(w => !ignorables.includes(w)).join(" ");
              const coreUser = userWords.filter(w => !ignorables.includes(w)).join(" ");

              if (coreCorrect === coreUser && coreCorrect.length > 0) return { status: 'warning', msg: `¡Estructura correcta! Faltó 'a' o 'the'.`, expected: exercise.correct_answer };
              if (cleanCorrect.includes('therefore') && cleanUser.includes('so')) {
                  const checkSo = cleanCorrect.replace('therefore', 'so');
                  if (checkSo === cleanUser) return { status: 'correct', msg: '¡Bien! Usaste SO en lugar de THEREFORE y vale igual.' };
              }

              return { status: 'incorrect', msg: specificFeedback || "Respuesta incorrecta.", expected: exercise.correct_answer };
          };

            const savedUnlocked = JSON.parse(localStorage.getItem('unlockedSectionsV12'));
            if (savedUnlocked) setUnlockedSections(savedUnlocked);
          }, []);

          useEffect(() => { localStorage.setItem('unlockedSectionsV12', JSON.stringify(unlockedSections)); }, [unlockedSections]);

             exercisesToEval.forEach(ex => {

                                </div>
                            </div>
                            <h3 className="text-xl sm:text-2xl font-medium text-slate-800 mb-4">{ex.question}</h3>
                            {hintsVisible[ex.id] && <div className="mb-4 bg-yellow-50 border border-yellow-200 p-3 rounded-xl text-yellow-800 text-sm"><strong>Pista:</strong> {ex.hint}</div>}
                            
                            {/* AQUI ESTÁN LOS ATRIBUTOS PARA EL APPLE PENCIL */}
                            <input 
                                type="text" 
                                lang="en" 
                                spellCheck="false" 
                                autoCorrect="off" 
                                autoCapitalize="off" 
                                value={answers[ex.id] || ""} 
                                onChange={(e) => handleInputChange(ex.id, e.target.value)} 
                                disabled={results !== null && res.status !== 'incorrect'} 
                                className={`w-full border-b-4 border-t-0 border-l-0 border-r-0 rounded-none p-3 text-xl sm:text-2xl outline-none transition-all font-medium bg-transparent ${res && res.status === 'incorrect' ? 'border-red-400 text-red-900 focus:border-red-600' : 'border-slate-300 text-slate-700 focus:border-blue-500'}`} 
                                placeholder="Escribe en inglés aquí..." 
                            />
                            
                            {res && res.status === 'incorrect' && (
                                <div className="mt-6 p-4 bg-red-100 rounded-2xl border border-red-200">
                                    <p className="text-red-800 font-bold text-lg">❌ {res.msg}</p>
                                    <p className="text-slate-800 mt-2 text-lg">Respuesta exacta: <span className="text-green-700 font-bold">{res.expected}</span></p>
                                    <button onClick={() => speakEnglish(res.expected)} className="mt-2 text-sm bg-green-200 text-green-800 px-3 py-1 rounded font-bold">🔊 Escuchar</button>
                                </div>
                            )}
                            {res && res.status === 'warning' && (
                                <div className="mt-6 p-4 bg-yellow-100 rounded-2xl border border-yellow-200"><p className="text-yellow-800 font-bold text-lg">⚠️ {res.msg}</p><p className="text-slate-600 mt-2">Era mejor decir: <em>{res.expected}</em></p></div>
                            )}
                            {res && res.status === 'correct' && <div className="mt-4"><p className="text-green-600 font-bold text-lg">✅ ¡Excelente!</p></div>}
                        </div>
                    );
                })}

                {!results && currentSection.match_pairs && <MatchGame pairs={currentSection.match_pairs} onComplete={() => setMatchCompleted(true)} />}

                <div className="mt-8 mb-12">
                    {results ? (
                        hasErrors ? <button onClick={() => setResults(null)} className="w-full bg-slate-800 text-white font-black py-6 rounded-2xl shadow-xl text-xl uppercase">Corregir mis errores</button>
                        : <button onClick={() => setView('list')} className="w-full bg-green-600 text-white font-black py-6 rounded-2xl shadow-xl text-xl uppercase">Siguiente Sección 🎉</button>
                    ) : (
                        <button onClick={evaluateSection} disabled={!matchCompleted} className={`w-full font-black py-6 rounded-2xl shadow-xl text-xl uppercase transition-all ${matchCompleted ? 'bg-blue-600 hover:bg-blue-700 text-white' : 'bg-slate-300 text-slate-500 cursor-not-allowed'}`}>
                            {matchCompleted ? 'Evaluar Sección' : 'Completa el juego primero'}
                        </button>
                    )}
                </div>
              </div>
            </div>
          );
        }

        function App() {
          const [view, setView] = useState('menu'); 
          
          if (view === 'menu') {
              return (
                  <div className="min-h-screen bg-slate-100 p-6 flex flex-col justify-center items-center">
                      <div className="max-w-2xl w-full">
                          <div className="text-center mb-12">
                              <h1 className="text-5xl font-black text-slate-800 tracking-tight">LingoCode <span className="text-blue-600">HUB</span></h1>
                              <p className="text-xl text-slate-500 mt-4 font-medium">Selecciona tu modo de entrenamiento, David.</p>
                          </div>

                          <div className="grid gap-6">
                              <button onClick={() => setView('unit_1')} className="bg-white p-8 rounded-3xl shadow-lg border-2 border-slate-200 hover:border-blue-400 hover:shadow-xl transition-all text-left group">
                                  <div className="flex items-center gap-6">
                                      <div className="text-6xl group-hover:scale-110 transition-transform">📚</div>
                                      <div>
                                          <h2 className="text-3xl font-black text-slate-800">Cuaderno Aleatorio</h2>
                                          <p className="text-slate-500 mt-2 text-lg">Unidad 1. Entra y el sistema elegirá 10 preguntas al azar de tu gran banco de datos.</p>
                                      </div>
                                  </div>
                              </button>

                              <button onClick={() => setView('simulator')} className="bg-slate-800 p-8 rounded-3xl shadow-lg border-2 border-slate-700 hover:border-red-400 hover:shadow-xl transition-all text-left group">
                                  <div className="flex items-center gap-6">
                                      <div className="text-6xl group-hover:scale-110 transition-transform">⏱️</div>
                                      <div>
                                          <h2 className="text-3xl font-black text-white">Simulador iTEP</h2>
                                          <p className="text-slate-300 mt-2 text-lg">Opción múltiple, 15 minutos de reloj. Preparación directa para mañana.</p>
                                      </div>
                                  </div>
                              </button>
                          </div>
                      </div>
                  </div>
              );
          }

          if (view === 'simulator') {
              return <ItepSimulator key={Date.now()} pool={simulator_pool} onFinish={() => setView('simulator')} onExit={() => setView('menu')} />;
          }

          if (view === 'unit_1') {
              return <UnitOneNotebook sectionsData={database.unit_1.sections} onExit={() => setView('menu')} />;
          }
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
